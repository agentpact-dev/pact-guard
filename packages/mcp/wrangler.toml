name = "pact-mcp"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
account_id = "1a2886a2f3c86b247da597816f1d2435"

routes = [
  { pattern = "mcp.agentpact.dev", custom_domain = true }
]

# Overridden for local dev via .dev.vars (gitignored) - see .dev.vars.example
[vars]
PACT_API_URL = "https://api.agentpact.dev/api/v1"

[durable_objects]
bindings = [
  { name = "MCP_OBJECT", class_name = "PactMcp" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PactMcp"]

[observability]
enabled = true
